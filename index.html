<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Tournament</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #facc15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }
        h1 {
            color: #facc15;
            margin-bottom: 5px;
        }
        p {
            color: #ccc;
            font-size: 14px;
        }
        .qr-section {
            background: #262626;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px dashed #facc15;
        }
        .qr-section img {
            width: 180px;
            height: 180px;
            border-radius: 8px;
            border: 2px solid #fff;
        }
        .btn-wa {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 FREE FIRE TOURNAMENT</h1>
        <p>Direct WhatsApp Par Register Karein 🎮</p>

        <div class="qr-section">
            <h3>📲 Scan QR Code to Register</h3>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://wa.me/917266030538?text=Hi%2C%20mujhe%20Free%20Fire%20Tournament%20me%20registration%20karna%20hai." alt="WhatsApp QR Code">
            <p style="margin-top: 10px;">GPay/Scanner se scan karke direct WhatsApp kholein.</p>
        </div>

        <p>Ya niche diye button par click karein 👇</p>
        
        <a class="btn-wa" href="https://wa.me/917266030538?text=Hi%2C%20mujhe%20Free%20Fire%20Tournament%20me%20registration%20karna%20hai." target="_blank">
            💬 Open WhatsApp Chat
        </a>
    </div>

</body>
</html>
